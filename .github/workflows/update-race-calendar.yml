name: Actualizar calendario de triatlón
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
permissions:
  contents: write
jobs:
  update-race-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pypdf
      - name: Extraer calendarios oficiales
        run: python scripts/update_race_feed.py
      - name: Publicar feed si hay cambios
        run: |
          if ! git diff --quiet -- race-feed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add race-feed.json
            git commit -m "Actualizar calendario oficial de pruebas"
            git push
          fi
