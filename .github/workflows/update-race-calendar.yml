name: Actualizar calendario de triatlón
on:
  push:
    branches: [main]
    paths-ignore:
      - 'race-feed.json'
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
permissions:
  contents: write
concurrency:
  group: official-race-calendar
  cancel-in-progress: false
jobs:
  update-race-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pypdf
      - name: Validar sintaxis y ejecutar pruebas automáticas
        run: |
          python -m py_compile scripts/update_race_feed.py scripts/test_update_race_feed.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Extraer calendarios oficiales
        run: python scripts/update_race_feed.py
      - name: Publicar feed si hay cambios
        run: |
          if ! git diff --quiet -- race-feed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add race-feed.json
            git commit -m "Actualizar calendario oficial de pruebas"
            cp race-feed.json /tmp/race-feed.json
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/race-feed.json race-feed.json
            git add race-feed.json
            git commit -m "Publicar extracción más reciente del calendario"
            git push
          fi
